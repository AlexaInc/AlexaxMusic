name: Update TV Channel List

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches:
      - master
    paths:
      - 'scripts/update_tv.py'
      - 'anony/helpers/adult.m3u'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Run update script
        run: python scripts/update_tv.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tv-channels.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update tv-channels.json [skip ci]" && git push)
